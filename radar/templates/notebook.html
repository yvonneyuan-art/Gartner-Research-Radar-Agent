<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Gartner Research Radar · 持续研究笔记</title><style>
:root{--ink:#122c35;--muted:#577078;--paper:#f3f4ee;--line:#cdd8d4;--green:#006c62;--gold:#dbe97d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}a{color:var(--green);text-underline-offset:4px}main{max-width:1220px;margin:auto;padding:40px 36px 80px}header{border-top:5px solid var(--green);padding:28px 0 36px;border-bottom:1px solid var(--line)}.overline{letter-spacing:.16em;font-size:12px;font-weight:700;color:var(--green)}h1{font-size:clamp(34px,5vw,62px);letter-spacing:-.05em;line-height:1.1;margin:20px 0}h1 small{display:block;font-size:22px;letter-spacing:.03em;font-weight:400;margin-top:16px}h2{font-size:27px;letter-spacing:-.02em;margin:0 0 22px}h3{margin:0 0 12px;font-size:19px}.meta,.muted{color:var(--muted);font-size:14px}.badge{display:inline-block;padding:3px 10px;background:#e0e9e2;border-radius:4px;font-size:12px;margin:4px 6px 4px 0}.status{background:var(--gold)}.notice{padding:14px 18px;border-left:3px solid var(--green);background:#e6ede4;margin:22px 0}nav{display:flex;flex-wrap:wrap;gap:8px 20px;margin:24px 0}nav a{font-size:13px;text-decoration:none}.hero{display:grid;grid-template-columns:2fr 1fr;gap:32px;background:var(--ink);color:#fff;padding:32px;margin-top:32px}.hero a{color:var(--gold)}.hero .muted{color:#b3c7c7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:center}.stat b{font-size:48px;line-height:1.2;font-weight:500;display:block;color:var(--gold)}.stat span{font-size:12px;color:#c4d7d5}.point{margin:0 0 16px}.refs{font-size:12px;white-space:normal}section{padding-top:42px}.table-wrap{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}th{text-align:left;background:#e3e9e2;color:var(--muted);font-size:11px;letter-spacing:.06em}td,th{padding:15px;vertical-align:top;border-bottom:1px solid var(--line)}td:first-child{width:28%;font-weight:600}.topics{display:grid;grid-template-columns:1fr 1fr;gap:20px}.topic{padding:24px;background:#fff;border:1px solid var(--line)}.topic h3{display:flex;justify-content:space-between}.topic .count{font-size:12px;color:var(--muted)}article{padding:26px 0;border-top:1px solid var(--line);scroll-margin-top:20px}.details{display:grid;grid-template-columns:2fr 1fr;gap:34px}.details aside{border-left:1px solid var(--line);padding-left:24px;font-size:13px}.label{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--green);text-transform:uppercase}.outline{padding-left:20px}.empty{color:var(--muted);font-size:14px}footer{margin-top:48px;border-top:1px solid var(--line);padding-top:20px;font-size:12px;color:var(--muted)}@media(max-width:760px){main{padding:20px 18px 50px}.hero,.topics,.details{grid-template-columns:1fr}.hero{padding:24px}.details aside{border-left:0;padding:0}.stats{border-top:1px solid #466066;padding-top:20px}h2{font-size:24px}}@media print{body{background:white}main{padding:0}nav{display:none}.hero{background:#eee;color:#122c35}.hero a,.stat b{color:#006c62}.topic,article{break-inside:avoid}}
</style><style>.edition{margin:32px 0 72px;scroll-margin-top:20px}.edition header h2{margin:12px 0}.archive-nav{padding:16px;background:#e3e9e2;display:flex;gap:20px;flex-wrap:wrap}</style></head><body><main><div class="overline">GARTNER / CONTINUOUS RESEARCH RADAR</div><h1>私有云与 AI<br>持续研究笔记</h1><p class="meta">一个页面，每周追加。首期回看近一个月，历史内容持续保留。最近更新：{{ latest.end }}</p><nav class="archive-nav">{% for edition in editions %}<a href="#edition-{{ edition.end }}">{{ edition.end }} {{ '月度基线' if edition.initial else '追加' }}</a>{% endfor %}</nav>{% for report in editions %}<div class="edition" id="edition-{{ report.end }}">{% include 'edition.html' %}</div>{% endfor %}</main></body></html>
