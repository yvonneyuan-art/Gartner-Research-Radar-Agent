name: Verify agent
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    if: github.ref != 'refs/heads/radar-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m radar.runner generate --demo --as-of 2026-09-18 --data-dir data-demo
