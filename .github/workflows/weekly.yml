name: Weekly Gartner Research Radar
on:
  schedule:
    - cron: '17 1 * * 5' # Friday 09:17 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research-radar-production
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Set edition date
        id: edition
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore durable research history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'research-radar-bot'
          git config user.email 'research-radar-bot@users.noreply.github.com'
          set +e
          git ls-remote --exit-code --heads origin radar-data > /dev/null
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            git fetch origin radar-data
            git worktree add --detach .runtime FETCH_HEAD
          elif [ "$status" = 2 ]; then
            git worktree add --detach .runtime HEAD
            git -C .runtime switch --orphan radar-data
          else
            echo 'Cannot read history branch; refusing to reset deduplication history.' >&2
            exit "$status"
          fi
      - name: Load verified first-month baseline into empty history
        shell: bash
        run: |
          if [ ! -f .runtime/state.json ]; then
            python -m radar.runner import-report --input bootstrap/2026-09-18.json --data-dir .runtime
          fi
      - name: Research and render
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python -m radar.runner generate --data-dir .runtime --as-of '${{ steps.edition.outputs.date }}'
      - name: Commit report and research history before publishing
        run: |
          git -C .runtime add state.json latest.json reports site
          if ! git -C .runtime diff --cached --quiet; then
            git -C .runtime commit -m 'Store weekly public research and report'
            git -C .runtime push origin HEAD:radar-data
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: radar-report
          path: .runtime/site
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .runtime/site
      - name: Deploy HTML archive
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Send Feishu notification after successful deployment
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_MODE: ${{ vars.FEISHU_MODE }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${FEISHU_MODE:-webhook}"
          if [ "$mode" = 'webhook' ] && [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo 'HTML published; Feishu delivery not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m radar.runner notify --data-dir .runtime --as-of '${{ steps.edition.outputs.date }}' --mode "$mode" --base-url "$PAGES_URL"
          git -C .runtime add state.json
          if ! git -C .runtime diff --cached --quiet; then
            git -C .runtime commit -m 'Record accepted Feishu delivery'
            git -C .runtime push origin HEAD:radar-data
          fi
      - name: Failure summary
        if: failure()
        run: echo 'Radar failed. Review the failed step. Existing published reports and durable history remain available; rerun to resume. No credentials are included in logs.' >> "$GITHUB_STEP_SUMMARY"
